<div class="container-fluid mt-5 mb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1"><i class="bi bi-plus-circle text-primary me-2"></i>Crear Nuevo Crédito</h2>
      <p class="text-muted mb-0">Registra un nuevo crédito para un cliente</p>
    </div>
    <button class="btn btn-outline-secondary" (click)="cancel()">
      <i class="bi bi-x me-1"></i>Cancelar
    </button>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <!-- MENSAJES -->
          <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
            <button type="button" class="btn-close" (click)="error = null"></button>
          </div>
          <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i>{{ successMessage }}
          </div>

          <!-- FORMULARIO -->
          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="row">
              <!-- CLIENTE -->
              <div class="col-md-6 mb-3">
                <label for="customerId" class="form-label fw-semibold">Cliente</label>
                <select class="form-select" id="customerId" formControlName="customerId" 
                        [ngClass]="{ 'is-invalid': isFieldInvalid('customerId') }">
                  <option value="">Seleccionar cliente...</option>
                  <option *ngFor="let customer of customers" [value]="customer.id">{{ customer.fullName }}</option>
                </select>
                <div class="invalid-feedback" *ngIf="isFieldInvalid('customerId')">
                  {{ getErrorMessage('customerId') }}
                </div>
              </div>

              <!-- VENTA -->
              <div class="col-md-6 mb-3">
                <label for="saleId" class="form-label fw-semibold">Venta</label>
                <select class="form-select" id="saleId" formControlName="saleId" 
                        [ngClass]="{ 'is-invalid': isFieldInvalid('saleId') }">
                  <option value="">Seleccionar venta...</option>
                  <option *ngFor="let sale of sales" [value]="sale.id">#{{ sale.id }} - ${{ sale.total | number:'1.2-2' }}</option>
                </select>
                <div class="invalid-feedback" *ngIf="isFieldInvalid('saleId')">
                  {{ getErrorMessage('saleId') }}
                </div>
              </div>

              <!-- PLAZO -->
              <div class="col-md-6 mb-3">
                <label for="termDays" class="form-label fw-semibold">Plazo (días)</label>
                <input type="number" class="form-control" id="termDays" formControlName="termDays" 
                       [ngClass]="{ 'is-invalid': isFieldInvalid('termDays') }" min="1" max="365">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('termDays')">
                  {{ getErrorMessage('termDays') }}
                </div>
              </div>

              <!-- TASA DE INTERÉS -->
              <div class="col-md-6 mb-3">
                <label for="interestRate" class="form-label fw-semibold">Tasa de Interés (%)</label>
                <input type="number" class="form-control" id="interestRate" formControlName="interestRate" 
                       [ngClass]="{ 'is-invalid': isFieldInvalid('interestRate') }" min="0" max="100" step="0.01">
                <div class="invalid-feedback" *ngIf="isFieldInvalid('interestRate')">
                  {{ getErrorMessage('interestRate') }}
                </div>
              </div>

              <!-- OBSERVACIONES -->
              <div class="col-12 mb-3">
                <label for="observations" class="form-label fw-semibold">Observaciones (opcional)</label>
                <textarea class="form-control" id="observations" formControlName="observations" rows="3"></textarea>
              </div>
            </div>

            <!-- BOTONES -->
            <div class="d-flex gap-2 justify-content-end">
              <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancelar</button>
              <button type="submit" class="btn btn-primary" [disabled]="isSaving || isLoading">
                <span *ngIf="!isSaving"><i class="bi bi-check me-1"></i>Guardar Crédito</span>
                <span *ngIf="isSaving">
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Guardando...
                </span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
